[project]
name = "top-and-tail"
version = "0"
requires-python = ">=3.13"

[dependency-groups]
dev = ["pytest>=8", "mutagen>=1.47", "mypy>=1.11"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["top-and-tail", "tests"]
python_version = "3.13"
strict = true
mypy_path = "tests"

# Test functions carry no annotations — a `-> None` on two dozen test cases is
# noise, not signal. Their bodies are still checked, so a real type error in a
# test still surfaces.
[[tool.mypy.overrides]]
module = ["conftest", "test_bounds", "test_cli"]
disallow_untyped_defs = false
disallow_untyped_calls = false
